<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueIt Extension</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="logo-container">
                <div class="logo-icon">
                    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                        <path d="M16 4C9.37 4 4 9.37 4 16C4 22.63 9.37 28 16 28C19.12 28 21.97 26.81 24.09 24.85L26.29 27.05C26.68 27.44 27.32 27.44 27.71 27.05C28.1 26.66 28.1 26.03 27.71 25.64L25.27 23.2C26.97 21.22 28 18.73 28 16C28 9.37 22.63 4 16 4ZM6.5 16C6.5 10.75 10.75 6.5 16 6.5C21.25 6.5 25.5 10.75 25.5 16C25.5 18.29 24.69 20.38 23.35 22.03L20.29 18.98C19.9 18.59 19.27 18.59 18.88 18.98C18.49 19.37 18.49 20 18.88 20.39L21.74 23.25C20.17 24.65 18.18 25.5 16 25.5C10.75 25.5 6.5 21.25 6.5 16Z" fill="white"/>
                        <rect x="9.5" y="10.5" width="13" height="2.2" rx="1.1" fill="white" fill-opacity="0.95"/>
                        <rect x="9.5" y="14.5" width="13" height="2.2" rx="1.1" fill="white" fill-opacity="0.8"/>
                        <rect x="9.5" y="18.5" width="9" height="2.2" rx="1.1" fill="white" fill-opacity="0.65"/>
                    </svg>
                </div>
                <span class="logo-text">QueueIt</span>
            </div>
            <div id="status-badge" class="badge">Detecting...</div>
        </header>

        <!-- Main Content -->
        <main>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Loading title...">
            </div>
            
            <div class="form-group">
                <label for="url">URL</label>
                <input type="text" id="url" readonly>
            </div>

            <div class="metadata">
                <span id="source-name">...</span>
                <span class="dot">•</span>
                <span id="read-time">...</span>
            </div>

            <!-- Error container -->
            <div id="error-container" class="error-box hidden">
                <span class="error-icon">!</span>
                <div class="error-text-container">
                    <span id="error-message"></span>
                    <button id="login-link-btn" type="button" class="btn-login-link hidden">Log In to QueueIt</button>
                </div>
            </div>
        </main>

        <!-- Footer / Actions -->
        <footer>
            <button id="save-btn" class="btn-primary" disabled>
                <span class="btn-icon">+</span>
                <span id="btn-text">Extracting...</span>
            </button>
        </footer>
        
        <!-- Success Overlay -->
        <div id="success-overlay" class="overlay hidden">
            <div class="success-icon">✓</div>
            <p>Saved to Queue ✓</p>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
